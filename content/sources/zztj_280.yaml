- id: zztj280-010
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）五月戊戌、壬寅"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "戊戌，昭義節度使皇甫立奏敬瑭反。敬瑭表：「帝，養子，不應承祀，請傳位許王。」帝手裂其表抵地，以詔答之曰：「卿於鄂王固非疏遠，衛州之事，天下皆知；許王之言，何人肯信！」壬寅，制削奪敬瑭官爵。"
  gloss_en: >-
    On wuxu Huangfu Li, Military Governor of Zhaoyi, reported that Shi Jingtang had rebelled. Shi's
    memorial said: 'The emperor is an adopted son and should not carry on the ancestral sacrifices;
    I request that the throne be passed to the Prince of Xu [Li Congyi, Mingzong's youngest son].'
    The emperor tore up the memorial with his own hands, threw it to the ground and answered by
    edict: 'You were hardly a stranger to the Prince of E [the deposed emperor Li Conghou] — what
    you did at Weizhou the whole realm knows. Who will believe your words about the Prince of Xu?'
    On renyin an edict stripped Shi of all his offices and titles.
  persons: [shi_jingtang, li_congke, huangfu_li, li_congyi, li_conghou]
  event_time:
