- id: jwds-075-001
  work: "舊五代史 (Jiu Wudai shi)"
  volume: 75
  locator: "卷七十五 清泰三年（936）五月（移鎮鄆州之後，石敬瑭召僚佐議）"
  url: "https://zh.wikisource.org/wiki/舊五代史/卷75"
  original_zh: "今我無異志，朝廷自啟禍機，不可安然死於道路。況太原險固之地，積粟甚多，若且寬我，我當奉之。必若加兵，我則外告鄰方，北構強敵，興亡之數，皎皎在天。"
  gloss_en: >-
    [Shi Jingtang to his staff:] 'Now, I have no disloyal intentions; it is the court itself that
    has set off the trigger of disaster, and I cannot meekly die on the road. Moreover, Taiyuan is a
    strong, defensible place with plenty of stored grain. If [the court] is lenient with me for now,
    I will serve it; but if it must send troops, then I will appeal to the neighbouring powers
    abroad and form an alliance with the strong enemy in the north — rise or fall, the outcome is
    plainly written in Heaven.'
  persons: [shi_jingtang, li_congke]
  event_time:
    year: 936
    month: 5
    leap: false
    lunar: true
    note: "After the transfer order of 五月辛卯 (≈ 26 May 936); same council as zztj280-007."
  location: jinyang_hq
  topics: [hedong_council, revolt, assistance_request, supplies]
