- id: zztj280-019
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）十一月（丁酉條之後、己亥條之前）"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "契丹主謂石敬瑭曰：「吾三千里赴難，必有成功。觀汝氣貌識量，真中原之主也。吾欲立汝為天子。」敬瑭辭讓數四，將吏復勸進，乃許之。契丹主作冊書，命敬瑭為大晉皇帝，自解衣冠授之，築壇於柳林。是日，即皇帝位。"
  gloss_en: >-
    The Khitan ruler said to Shi Jingtang: 'I came three thousand li to rescue you and must
    accomplish something. Looking at your bearing, insight and capacity, you are truly a ruler for
    the Central Plain. I wish to make you Son of Heaven.' Shi declined several times, but when his
    generals and officials urged him again he accepted. The Khitan ruler composed a patent of
    investiture naming Shi Emperor of the Great Jin, took off his own robe and cap and gave them to
    him, and had an altar built at Liulin. That same day Shi ascended the imperial throne.
  persons: [yelu_deguang, shi_jingtang]
  event_time:
    year: 936
    month: 11
    leap: false
    lunar: true
    note: "十一月丁酉 = day 12, ≈ 28 Nov 936 (date from the JWDS patent heading and XWDS 卷8; ZZTJ narrates it between 丁酉 and 己亥). JWDS 卷48 alone gives 閏月丁卯 (not excerpted)."
