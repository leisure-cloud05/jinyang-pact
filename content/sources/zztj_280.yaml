    annotation has 誕妄/毫末.

- id: zztj280-023
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）閏十一月"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "契丹主曰：「爾見捕鼠者乎，不備之，猶或嚙傷其手，況大敵乎！」對曰：「今大國已扼其喉，安能嚙人乎！」契丹主曰：「吾非有渝前約也，但兵家權謀不得不爾。」對曰：「皇帝以信義救人之急，四海之人俱屬耳目，奈何一旦二三其命，使大義不終！臣竊為皇帝不取也。」跪於帳前，自旦至暮，涕泣爭之。契丹主乃從之，指帳前石謂德鈞使者曰：「我已許石郎，此石爛，可改矣！」"
  gloss_en: >-
    The Khitan ruler said: 'Have you ever watched someone catch a rat? If he is careless it can
    still bite his hand — how much more a great enemy!' Sang replied: 'Your great state already has
    it by the throat; how could it bite anyone?' The Khitan ruler said: 'It is not that I am going
    back on my earlier pledge; military expediency simply requires it.' Sang replied: 'Your Majesty
    came to the rescue of a man in distress out of good faith and righteousness, and the whole world
    is watching. How can you suddenly waver in your commitment and leave the great cause unfinished?
    I humbly think Your Majesty should not do this.' He knelt before the tent from dawn to dusk,
    arguing with tears. At last the Khitan ruler agreed and, pointing to a stone in front of the
    tent, told Zhao Dejun's envoy: 'I have already promised Lord Shi. When this stone rots away, it
    may be changed!'
  persons: [yelu_deguang, sang_weihan, zhao_dejun, shi_jingtang]
  event_time:
    year: 936
    month: 11
    leap: true
    lunar: true
    note: "Intercalary eleventh month (continuation of zztj280-022)."
  location: "other:khitan_camp_liulin"
  topics: [persuasion, rival_bid, stone_oath, persona]
  kind: speech
