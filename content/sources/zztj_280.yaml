- id: zztj280-016
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）八月（戊寅條之後）"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "唐主使端明殿學士呂琦至河東行營犒軍，楊光遠謂琦曰：「願附奏陛下，幸寬宵旰。賊若無援，旦夕當平；若引契丹，當縱之令入，可一戰破也。」帝甚悅。帝聞契丹許石敬瑭以仲秋赴援，屢督張敬達急攻晉陽，不能下。每有營構，多值風雨，長圍夏為水潦所壞，竟不能合，晉陽城中日窘，糧儲浸乏。"
  gloss_en: >-
    The Tang ruler sent Lü Qi, Academician of the Duanming Hall, to reward the troops at the Hedong
    field headquarters. Yang Guangyuan told Lü: 'Please report to His Majesty that he may rest
    easier. If the rebels get no help they will be crushed any day now; if they bring in the Khitan,
    we should let them come in and can destroy them in a single battle.' The emperor was delighted.
    When he heard that the Khitan had promised Shi Jingtang to come to his rescue in mid-autumn, he
    repeatedly urged Zhang Jingda to take Jinyang quickly, but it could not be taken. Whenever siege
    works were built they were mostly struck by wind and rain; the encircling wall was washed away
    by the summer floods and could never be closed. Meanwhile the city of Jinyang grew more
    straitened by the day and its grain stores gradually ran short.
  persons: [li_congke, lu_qi, yang_guangyuan, zhang_jingda, shi_jingtang, yelu_deguang]
  event_time:
    year: 936
    month: 8
    leap: false
    lunar: true
    note: "After 八月戊寅 (≈ 10 Sep 936); the last sentences summarise the summer siege."
  location: "other:tang_siege_camp"
  topics: [siege, supplies, khitan_response]
