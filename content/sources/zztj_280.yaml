  locator: "卷二百八十 丙申（936）閏十一月辛巳"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "辛巳，唐主與曹太后、劉皇后、雍王重美及宋審虔等攜傳國寶登玄武樓自焚，皇后積薪欲燒宮室，重美諫曰：「新天子至，必不露居，他日重勞民力；死而遺怨，將安用之！」乃止。"
  gloss_en: >-
    On xinsi the Tang ruler, with Empress Dowager Cao, Empress Liu, his son Chongmei the Prince of
    Yong, Song Shenqian and others, carried the imperial seal up the Xuanwu Tower and burned
    themselves to death. The empress had firewood piled up to burn the palace as well, but Chongmei
    remonstrated: 'When the new Son of Heaven arrives he will not live in the open; later the people
    would have to be burdened again [to rebuild]. What use is it to leave resentment behind us in
    death?' So she desisted.
