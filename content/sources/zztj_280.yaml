- id: zztj280-009
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）五月（甲午條之後）"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "掌書記洛陽桑維翰曰：「主上初即位，明公入朝，主上豈不知蛟龍不可縱之深淵邪？然卒以河東復授公，引乃天意假公以利器。明宗遺愛在人，主上以庶孽代之，群情不附。公明宗之愛婿，今主上以反逆見待，此非首謝可免，但力為自全之計。契丹主素與明宗約為兄弟，今部落近在雲、應，公誠能推心屈節事之，萬一有急，朝呼夕至，何患無成。」敬瑭意遂決。"
  gloss_en: >-
    The Secretary (zhang shuji) Sang Weihan of Luoyang said: 'When His Majesty had just taken the
    throne and Your Excellency came to court, did he not know that a dragon must not be let loose
    into the deep? Yet in the end he gave Hedong back to you — this is Heaven lending you a sharp
    weapon. Emperor Mingzong's kindness is still remembered by the people, and His Majesty, a son of
    a lesser line, has taken the place of his house; popular feeling is not with him. You are
    Mingzong's beloved son-in-law, yet His Majesty now treats you as a rebel; that cannot be escaped
    by confessing and apologising — you must put all your strength into preserving yourself. The
    Khitan ruler long ago swore brotherhood with Mingzong, and his tribes are now close by at Yun
    and Ying. If you can truly open your heart, humble yourself and serve him, then in an emergency
    he will come in the evening if called in the morning — why worry about failure?' With that,
    Shi's mind was made up.
  persons: [sang_weihan, shi_jingtang, li_congke, li_siyuan, yelu_deguang]
  event_time:
    year: 936
    month: 5
    leap: false
    lunar: true
