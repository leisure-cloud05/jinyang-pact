- id: zztj280-015
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）八月（癸亥條）"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "石敬瑭以劉知遠為馬步都指揮使，安重榮、張萬迪降兵皆隸焉。知遠用法無私，撫之如一，由是人無貳心。敬瑭親乘城，坐臥矢石下，知遠曰：「觀敬達輩高壘深塹，欲為持久之計，無他奇策，不足慮也。願明公四出間使，經略外事。守城至易，知遠獨能辦之。」敬瑭執知遠手，撫其背而賞之。"
  gloss_en: >-
    Shi Jingtang made Liu Zhiyuan Commander of the Cavalry and Infantry, and the troops who had come
    over with An Chongrong and Zhang Wandi were all placed under him. Liu enforced the rules
    impartially and treated everyone alike, so no one wavered in loyalty. Shi himself went up on the
    walls, sitting and lying amid the arrows and stones. Liu said: 'I observe that Zhang Jingda and
    his like are building high ramparts and deep trenches, planning for a long siege. They have no
    clever stratagem and are not worth worrying about. I hope Your Excellency will send secret
    envoys out in every direction and manage affairs outside. Holding the city is very easy; I,
    Zhiyuan, can see to it alone.' Shi took Liu's hand, patted his back and praised him.
  persons: [liu_zhiyuan, shi_jingtang, an_chongrong, zhang_wandi, zhang_jingda]
  event_time:
    year: 936
    month: 8
    leap: false
    lunar: true
    note: "八月, from 癸亥 (≈ 26 Aug 936) on — after the request had gone."
  location: jinyang_hq
  topics: [siege, supplies, persona]
  kind: speech
  learnable_by:
