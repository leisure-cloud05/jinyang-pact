- id: zztj280-018
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）九月辛丑"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "契丹縱兵乘之，唐兵大敗，步兵死者近萬人，騎兵獨全。敬達等收餘眾保晉安，契丹亦引兵歸虎北口。敬瑭得唐降兵千餘人，劉知遠勸敬瑭盡殺之。是夕，敬瑭出北門見契丹主，契丹主執敬瑭手，恨相見之晚。"
  gloss_en: >-
    The Khitan let loose their troops to press the advantage; the Tang army was routed, nearly ten
    thousand infantry were killed and only the cavalry escaped intact. Zhang Jingda and the others
    gathered the survivors and held Jin'an, while the Khitan withdrew to Hubeikou. Shi Jingtang took
    more than a thousand Tang prisoners; Liu Zhiyuan urged him to kill them all. That evening Shi
    went out of the north gate to meet the Khitan ruler, who took his hand and regretted that they
    had not met sooner.
  persons: [yelu_deguang, zhang_jingda, shi_jingtang, liu_zhiyuan]
  event_time:
    year: 936
    month: 9
    leap: false
    lunar: true
    note: "九月辛丑 = day 15, ≈ 3 Oct 936 (JWDS 卷48: 'the 15th of this month'); 遼史 dates the battle 庚子, one day earlier."
