- id: zztj280-022
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）閏十一月"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "帝聞之，大懼，亟使桑維翰見契丹主，說之曰：「大國舉義兵以救孤危，一戰而唐兵瓦解，退守一柵，食盡力窮。趙北平父子不忠不信，畏大國之強，且素蓄異志，按兵觀變，非以死徇國之人，何足可畏，而信其誕亡之辭，貪豪末之利，棄垂成之功乎！且使晉得天下，將竭中國之財以奉大國，豈此小利之比乎！」"
  gloss_en: >-
    The emperor [Shi, by now emperor of Jin] was greatly alarmed when he heard of it and hurriedly
    sent Sang Weihan to see the Khitan ruler. Sang argued: 'Your great state raised a righteous army
    to rescue the isolated and imperilled, and in a single battle the Tang army fell apart; it has
    retreated into one stockade, its food gone and its strength spent. Zhao of Beiping and his son
    are neither loyal nor trustworthy; they fear your great state's power, have long nursed
    ambitions of their own and are holding back their troops to see which way things go — they are
    not men who would die for their country. What is there to fear from them? Would you believe
    their preposterous words, covet a hair's breadth of gain and throw away an achievement on the
    verge of completion? Moreover, if Jin gains the realm it will exhaust the wealth of the Central
    Plain to serve your great state — how can this petty gain compare with that?'
  persons: [sang_weihan, yelu_deguang, zhao_dejun, zhao_yanshou, shi_jingtang]
  event_time:
    year: 936
    month: 11
    leap: true
    lunar: true
    note: "Intercalary eleventh month, before the fall of Jin'an on 甲子 (≈ 25 Dec 936) in ZZTJ's narrative."
  location: "other:khitan_camp_liulin"
  topics: [persuasion, rival_bid]
  kind: speech
  learnable_by:
