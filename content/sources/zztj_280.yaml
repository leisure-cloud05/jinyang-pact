- id: zztj280-001
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）春正月癸丑"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "癸丑，唐主以千春節置酒，晉國長公主上壽畢，辭歸晉陽。帝醉，曰：「何不且留？遽歸，欲與石郎反邪！」石敬瑭聞之，益懼。"
  gloss_en: >-
    On the guichou day the Tang ruler [Li Congke] gave a banquet for his birthday, the Qianchun
    Festival. When the Grand Princess of Jin [Shi Jingtang's wife, a daughter of Emperor Mingzong]
    had offered her birthday toast and asked leave to return to Jinyang, the emperor, drunk, said:
    'Why not stay a while? Hurrying back like this — do you mean to rebel together with Lord Shi?'
    When Shi Jingtang heard of it he became even more afraid.
  persons: [li_congke, princess_jinguo, shi_jingtang]
  event_time:
    year: 936
    month: 1
    leap: false
    lunar: true
    note: "正月癸丑 = day 23, ≈ 18 Feb 936 (Julian, computed); the Qianchun Festival was Li Congke's birthday."
  location: luoyang_court
  topics: [li_congke_suspicion]
  kind: speech
  learnable_by:
    - { holder: shi_jingtang, when: initial }
    - { holder: sang_weihan, when: initial }
    - { holder: liu_zhiyuan, when: initial }
    - { holder: yelu_deguang, when: never_initial }
    - { holder: li_congke, when: initial }
    - { holder: player, when: initial }
  derived_from: []
  conflicts_with: []
  credibility: 0.75
  credibility_note: >-
    Banquet remark. Shi himself quotes the same words to his staff in JWDS 卷75 (「爾歸心甚急，欲與石郎反耶？」, not
    excerpted), so the gist is doubly attested; the wording is reconstructed. Hedong holders know it
    because Shi repeats it in council (zztj280-007).

- id: zztj280-002
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）三月（丁巳條之前）"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "琦曰：「河東若有異謀，必結契丹為援。契丹母以贊華在中國，屢求和親，但求萴剌等未獲，故和未成耳。今誠歸萴刺等與之和，歲以禮幣約直十餘萬緡遺之，彼必歡然承命。如此，則河東雖欲陸梁，無能為矣。」崧曰：「此吾志也。然錢穀皆出三司，宜更與張相謀之。」遂告張延朗，延朗曰：「如學士計，不惟可以制河東，亦省邊費之什九，計無便於此者。若主上聽從，但責辦於老夫，請於軍財之外捃拾以供之，他夕，二人密言於帝，帝大喜，稱其忠，二人私草《遺契丹書》以俟命。"
  gloss_en: >-
    Lü Qi said [to Li Song]: 'If Hedong has treasonous designs it will certainly bind itself to the
    Khitan for support. Because Zanhua [the exiled Khitan prince Yelü Bei] is in China, the Khitan
    mother has repeatedly sought peace and a marriage alliance; peace has not been made only because
    her request for the return of Cela and the other captives was never granted. If we now really
    return Cela and the others and make peace, sending them every year ritual gifts worth some
    100,000 strings of cash, they will gladly comply. Then, however much Hedong wants to run wild,
    it can do nothing.' Li Song said: 'That is my own wish. But money and grain all come from the
    Finance Commission; we should also consult Chief Minister Zhang.' They told Zhang Yanlang, who
    said: 'The Academician's plan would not only hold Hedong in check but also save nine-tenths of
    our frontier expenses — nothing could be more convenient. If His Majesty agrees, leave the
    funding to this old man; I will scrape it together outside the army's funds.' One evening the
    two men put the plan to the emperor in secret; he was delighted and praised their loyalty, and
    they privately drafted a 'Letter to the Khitan' to await his command.
  persons: [lu_qi, li_song, zhang_yanlang, li_congke, yelu_bei, empress_shulu]
  event_time:
    year: 936
    month: 3
    leap: false
    lunar: true
    note: "ZZTJ groups the episode under 三月; the plan preceded Lü Qi's demotion on 三月丁巳 (≈ 22 Apr 936) by some time ('久之' in zztj280-003)."
  location: luoyang_court
  topics: [tang_court_debate, peace_marriage_proposal, khitan_relations, gold_silk_gifts]
  kind: speech
  learnable_by:
    - { holder: shi_jingtang, when: never_initial }
    - { holder: sang_weihan, when: never_initial }
    - { holder: liu_zhiyuan, when: never_initial }
    - { holder: yelu_deguang, when: never_initial }
    - { holder: li_congke, when: initial }
    - { holder: player, when: never_initial }
  derived_from: []
  conflicts_with: []
  credibility: 0.65
  credibility_note: >-
    Secret deliberation at the Later Tang court, reported only by ZZTJ among the fetched texts (the
    JWDS 卷48 annotation cites ZZTJ for it). Hedong and the Khitan could not know it. The
    transcription writes the captive's name both 萴剌 and 萴刺 and lacks the closing quotation mark
    after 「以供之」; kept verbatim.

- id: zztj280-003
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）三月（丁巳條之前）"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "久之，帝以其謀告樞密直學士薛文遇，文遇對曰：「以天子之尊，屈身奉夷狄，不亦辱乎！又，虜若循故事求尚公主，何以拒之？」因誦戎昱《昭君詩》曰：「安危托婦人。」帝意遂變。"
  gloss_en: >-
    Some time later the emperor told the plan to Xue Wenyu, Auxiliary Academician of the Bureau of
    Military Affairs. Xue replied: 'For the Son of Heaven, in all his dignity, to bend himself to
    serve barbarians — is that not a disgrace? Besides, if the caitiffs follow precedent and ask to
    marry a princess, how could you refuse?' He then recited the line from Rong Yu's poem on Wang
    Zhaojun: 'The safety of the realm entrusted to a woman.' The emperor changed his mind.
  persons: [li_congke, xue_wenyu]
  event_time:
    year: 936
    month: 3
    leap: false
    lunar: true
    note: "Between the peace plan and Lü Qi's demotion on 三月丁巳 (≈ 22 Apr 936)."
  location: luoyang_court
  topics: [tang_court_debate, peace_marriage_proposal, khitan_relations]
  kind: speech
  learnable_by:
