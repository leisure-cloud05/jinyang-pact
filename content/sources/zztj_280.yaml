  original_zh: "劉知遠諫曰：「稱臣可矣，以父事之太過。厚以金帛賂之，自足致其兵，不必許以土田，恐異日大為中國之患，悔之無及。」"
  gloss_en: >-
    Liu Zhiyuan remonstrated: 'Calling yourself his subject is acceptable, but serving him as a
    father goes too far. Bribe him generously with gold and silk and that alone will be enough to
    bring his troops; there is no need to promise him land. I fear it will one day be a great
    calamity for the Central Plain, and then it will be too late for regret.'
