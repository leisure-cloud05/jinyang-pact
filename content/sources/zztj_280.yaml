  gloss_en: >-
    From Abaoji's time the Khitan had destroyed many states and dominated the north. But when they
    went to rescue Wang Du they were defeated by Wang Yanqiu, losing ten thousand horsemen as well
    as Hemiao and others, all famous generals; and Shulü longed especially for Tuyu [her eldest son,
    who had fled to Tang]. So they repeatedly sent envoys to China with humble words and rich gifts,
