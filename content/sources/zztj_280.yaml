- id: zztj280-021
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）閏十一月"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "閏月，趙延壽獻契丹主所賜詔及甲馬弓劍，詐雲德鈞遣使致書於契丹主，為唐結好，說令引兵歸國；其實別為密書，厚以金帛賂契丹主，云：「若立己為帝，請即以見兵南平洛陽，與契丹為兄弟之國；仍許石氏常鎮河東。」契丹主自以深入敵境，晉安未下，德鈞兵尚強，范延光在其東，又恐山北諸州邀其歸路，欲許德鈞之請。"
  gloss_en: >-
    In the intercalary month Zhao Yanshou presented [to the Tang ruler] an edict, armour, horses,
    bows and swords given by the Khitan ruler, falsely claiming that Zhao Dejun had sent envoys with
    a letter to the Khitan ruler to make peace on Tang's behalf and to persuade him to take his
    troops home. In reality Zhao Dejun had written a separate secret letter bribing the Khitan ruler
    generously with gold and silk and saying: 'If you make me emperor, I will at once take my
    present army south to pacify Luoyang, and we will be brother states with the Khitan; I will also
    let the Shi family hold Hedong permanently.' The Khitan ruler, considering that he had advanced
    deep into enemy territory, that Jin'an had not yet fallen, that Zhao Dejun's army was still
    strong and Fan Yanguang was to his east, and fearing too that the prefectures north of the
    mountains might cut off his way home, was inclined to grant Zhao Dejun's request.
  persons: [zhao_yanshou, zhao_dejun, yelu_deguang, li_congke, fan_yanguang, shi_jingtang]
  event_time:
    year: 936
    month: 11
    leap: true
    lunar: true
    note: "Intercalary eleventh month (閏十一月, ≈ 17 Dec 936 to about 14 Jan 937), encoded as month 11. ZZTJ places Zhao Yanshou's report at the start of the month, before 甲子 (≈ 25 Dec 936); the secret approach itself was earlier, and 遼史 has a Zhao Dejun envoy at the Khitan court already in 七月 (ls-003-002)."
