- id: zztj280-008
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）五月（甲午條之後）"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "幕僚段希堯極言拒之，敬瑭以其樸直，不責也。節度使判官華陰趙瑩勸敬瑭赴鄆州；觀察判官平遙薛融曰：「融書生，不習軍旅。」都押牙劉知遠曰：「明公久將兵，得士卒心；今據形勝之地，士馬精強，若稱兵傳檄，帝業可成，奈何以一紙制書自投虎口乎！」"
  gloss_en: >-
    Duan Xiyao, one of his staff, argued vehemently against it [against defying the court]; Shi,
    regarding him as simple and honest, did not blame him. Zhao Ying of Huayin, the Military
    Governor's Administrative Assistant, urged Shi to go to Yunzhou [i.e. to obey]; Xue Rong of
    Pingyao, the Surveillance Administrative Assistant, said: 'I am a scholar and do not understand
    military matters.' The Chief of the Headquarters Guard (du yaya) Liu Zhiyuan said: 'Your
    Excellency has long commanded troops and has won the soldiers' hearts. You now hold a
    strategically advantageous position with strong men and horses. If you raise troops and
    circulate proclamations, an imperial enterprise can be achieved. Why deliver yourself into the
    tiger's mouth for the sake of a single sheet of edict?'
  persons: [duan_xiyao, zhao_ying, xue_rong, liu_zhiyuan, shi_jingtang]
  event_time:
    year: 936
    month: 5
    leap: false
    lunar: true
    note: "Same council as zztj280-007 (between ≈ 29 May 936 and ≈ 2 Jun 936)."
  location: jinyang_hq
