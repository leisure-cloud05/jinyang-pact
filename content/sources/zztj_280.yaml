- id: jwds-075-002
  work: "舊五代史 (Jiu Wudai shi)"
  volume: 75
  locator: "卷七十五 晉書一 高祖紀一 清泰三年（936）十一月 契丹冊文"
  url: "https://zh.wikisource.org/wiki/舊五代史/卷75"
  original_zh: "猥以眇躬，奄有北土，暨明宗之享國也，與我先哲王保奉明契，所期子孫順承，患難相濟。丹書未泯，白日難欺，顧予纂承，匪敢失墜。爾惟近戚，實系本枝，所以余視爾若子，爾待予猶父也。"
  gloss_en: >-
    [From the Khitan emperor's patent investing Shi Jingtang:] 'I, unworthy as I am, came to rule
    the northern lands. When Mingzong reigned, he and our late wise king [Abaoji] kept a bright
    covenant, hoping that their descendants would honour it and help one another in adversity. The
    vermilion oath is not yet faded and the bright sun cannot be deceived; having succeeded to the
    throne, I dare not let it lapse. You are a close relative [of Mingzong], truly of the main stem;
    therefore I look on you as a son, and you treat me as a father.'
  persons: [yelu_deguang, shi_jingtang, li_siyuan, yelu_abaoji]
  event_time:
    year: 936
    month: 11
    leap: false
    lunar: true
    note: "The patent is headed 「十一月丙戌朔，十二日丁酉」 = ≈ 28 Nov 936; its year 天顯九年 is an error for 天顯十一年."
  location: "other:khitan_camp_liulin"
