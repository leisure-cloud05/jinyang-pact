  original_zh: "辛卯，以敬瑭為天平節度使，以馬軍都指揮使、河陽節度使宋審虔為河東節度使。製出，兩班聞呼敬瑭名，相顧失色。甲午，以建雄節使張敬達為西北蕃漢馬步都部署，趣敬瑭之鄆州。"
  gloss_en: >-
    On xinmao Shi Jingtang was appointed Military Governor of Tianping, and Song Shenqian, Commander
    of the Cavalry and Military Governor of Heyang, was made Military Governor of Hedong. When the
    edict was proclaimed and the two ranks of officials heard Shi's name called, they looked at one
    another aghast. On jiawu Zhang Jingda, Military Governor of Jianxiong, was made Chief Commander
    of the Chinese and Tribal Cavalry and Infantry of the Northwest, to hurry Shi on his way to
    Yunzhou [seat of the Tianping command].
