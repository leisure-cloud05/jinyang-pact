    - { holder: sang_weihan, when: never_initial }
    - { holder: liu_zhiyuan, when: never_initial }
    - { holder: yelu_deguang, when: never_initial }
    - { holder: li_congke, when: initial }
    - { holder: player, when: never_initial }
  derived_from: []
