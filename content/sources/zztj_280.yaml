- id: zztj280-024
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）閏十一月甲子"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "諸將每旦集於招討使營，甲子，高行周、符彥卿未至，光遠乘其無備，斬敬達首，帥諸將上表降於契丹。契丹主素聞諸將名，皆慰勞，賜以裘帽，因戲之曰：「汝輩亦大惡漢，不用鹽酪啖戰馬萬匹！」光遠等大慚。契丹主嘉張敬達之忠，命收葬而祭之，謂其下及晉諸將曰：「汝曹為人臣，當效敬達也。」"
  gloss_en: >-
    The generals gathered every morning at the camp of the Pacification Commissioner [Zhang Jingda].
    On jiazi, before Gao Xingzhou and Fu Yanqing had arrived, Yang Guangyuan caught Zhang off guard,
    cut off his head and led the generals in submitting a memorial of surrender to the Khitan. The
    Khitan ruler, who had long known these generals by name, comforted them all and gave them fur
    coats and caps, joking: 'You are real villains too — eating ten thousand war-horses without even
    salt or cheese!' Yang and the others were deeply ashamed. The Khitan ruler, admiring Zhang
    Jingda's loyalty, had him buried with sacrifices and said to his own men and the Jin generals:
    'As subjects, you should all follow Jingda's example.'
  persons: [yang_guangyuan, zhang_jingda, gao_xingzhou, fu_yanqing, yelu_deguang]
  event_time:
    year: 936
    month: 11
    leap: true
    lunar: true
    note: "閏十一月甲子 = day 9 of the intercalary month, ≈ 25 Dec 936 (same date in JWDS 卷48 and 遼史 卷3)."
  location: "other:jin_an_camp"
  topics: [surrender, zhang_jingda_death, persona]
