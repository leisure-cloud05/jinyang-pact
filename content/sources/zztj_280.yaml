- id: zztj280-004
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）三月丁巳"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "一日，急召崧、琦至後樓，盛怒，責之曰：「卿輩皆知古今，欲佐人主致太平；今乃為謀如是！朕一女尚乳臭，卿欲棄之沙漠邪？且欲以養士之財輸之虜庭，其意安在？」二人懼，汗流浹背，曰：「臣等志在竭愚以報國，非為虜計也，願陛下察之。」拜謝無數，帝詬責不已。呂琦氣竭，拜少止，帝曰：「呂琦強項，肯視朕為人主邪！」琦曰：「臣等為謀不臧，願陛下治其罪，多拜可為！」帝怒稍解，止其拜，各賜卮酒罷之，自是群臣不敢復言和親之策。丁巳，以琦為御史中丞，蓋疏之也。"
  gloss_en: >-
    One day the emperor urgently summoned Li Song and Lü Qi to the rear tower and, in a towering
    rage, rebuked them: 'You both know the past and the present and claim to help your sovereign
    bring about peace — and this is the plan you devise! My only daughter still smells of her
    mother's milk; would you cast her away into the desert? And you would ship the wealth meant to
    feed our soldiers to the caitiffs' court — what do you mean by it?' The two, terrified and
    drenched in sweat, said: 'Our aim was to use our poor wits to serve the state, not to scheme for
    the caitiffs; may Your Majesty see this.' They kowtowed without number while the emperor went on
    berating them. When Lü Qi, out of breath, slowed his bowing, the emperor said: 'Lü Qi is
    stiff-necked — does he even regard me as his sovereign?' Lü Qi said: 'Our plan was unsound; let
    Your Majesty punish us for it — what good is more bowing!' The emperor's anger eased a little;
    he stopped their bowing, gave each a cup of wine and dismissed them. From then on no official
    dared to mention the marriage-peace policy again. On the dingsi day Lü Qi was made Vice
    Censor-in-Chief — in effect a way of keeping him at a distance.
  persons: [li_congke, li_song, lu_qi]
  event_time:
    year: 936
    month: 3
    leap: false
    lunar: true
    note: "Rebuke undated; Lü Qi's demotion on 三月丁巳 = day 28, ≈ 22 Apr 936 (same date in JWDS 卷48)."
  location: luoyang_court
  topics: [tang_court_debate, peace_marriage_proposal, persona]
  kind: speech
  learnable_by:
    - { holder: shi_jingtang, when: never_initial }
    - { holder: sang_weihan, when: never_initial }
    - { holder: liu_zhiyuan, when: never_initial }
    - { holder: yelu_deguang, when: never_initial }
    - { holder: li_congke, when: initial }
    - { holder: player, when: never_initial }
  derived_from: []
  conflicts_with: []
  credibility: 0.6
  credibility_note: >-
    Vivid private scene with literary dialogue; the demotion and its date are corroborated by JWDS
    卷48. Useful mainly as a grounded cue for Li Congke's temper.

- id: zztj280-005
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）五月庚寅"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "五月，庚寅夜，李崧請急在外，薛文遇獨直，帝與之議河東事，文遇曰：「諺有之：『當道築室，三年不成。』茲事斷自聖志；群臣各為身謀，安肯盡言！以臣觀之，河東移亦反，不移亦反，在旦暮耳，不若先事圖之。」先是，術者言國家今年應得賢佐，出奇謀，定天下。帝意文遇當之，聞其言，大喜，曰：「卿言殊豁吾意，成敗吾決行之。」即為除目，付學士院使草制。"
  gloss_en: >-
    Fifth month, the night of gengyin. Li Song was away on urgent leave and Xue Wenyu alone was on
    night duty, so the emperor discussed the Hedong question with him. Xue said: 'The proverb says,
    "Build a house beside the road and in three years it is still unfinished" [too many passers-by
    give advice]. This matter must be decided by Your Majesty's own will; the officials all look out
    for themselves — which of them will speak frankly? As I see it, Hedong will rebel if transferred
    and rebel if not — it is only a matter of days. Better to strike first.' Earlier, a diviner had
    said that this year the state would gain a wise adviser who would devise a brilliant plan and
    settle the realm. The emperor thought Xue was that man and, hearing him, was overjoyed: 'Your
    words open my mind. Success or failure, I am resolved to do it.' He at once wrote out the
    appointment list and sent it to the Academy to have the edict drafted.
  persons: [li_congke, xue_wenyu, li_song]
  event_time:
    year: 936
    month: 5
    leap: false
    lunar: true
    note: "五月庚寅 = day 2, ≈ 25 May 936 (the 五月 start is estimated, but the sexagenary day fixes the date)."
  location: luoyang_court
  topics: [li_congke_suspicion, tianping_transfer, persona]
  kind: speech
  learnable_by:
