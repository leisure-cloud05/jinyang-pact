  locator: "卷一百三十七 外國列傳一 契丹 天成元年（926）"
  url: "https://zh.wikisource.org/wiki/舊五代史/卷137"
  original_zh: "阿保機號咷，聲淚俱發，曰：「我與河東先世約為兄弟，河南天子吾兒也。近聞漢地兵亂，點得甲馬五萬騎，比欲自往洛陽救助我兒，又緣渤海未下，我兒果致如此，冤哉！」泣下不能已。"
  gloss_en: >-
    Abaoji wailed, his voice and tears bursting out together, and said: 'The former lord of Hedong
    [Li Keyong] and I swore to be brothers, so the Son of Heaven in Henan [Zhuangzong] is my son.
    Recently, hearing of the fighting in the Chinese lands, I mustered fifty thousand armoured
    horsemen and meant to go to Luoyang myself to save my son, but because Bohai had not yet been
    subdued [I could not]; and now my son has indeed come to this — what an injustice!' He wept
    without stopping.
