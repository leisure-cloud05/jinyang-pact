- id: zztj280-007
  work: "資治通鑑 (Zizhi Tongjian)"
  volume: 280
  locator: "卷二百八十 丙申（936）五月（甲午條之後）"
  url: "https://zh.wikisource.org/wiki/資治通鑑/卷280"
  original_zh: "敬瑭疑懼，謀於將佐曰：「吾之再來河東也，主上面許終身不除代；今忽有是命，得非如今年千春節與公主所言乎？我不興亂，朝廷發之，安能束手死於道路乎！今且發表稱疾以觀其意，若其寬我，我當事之；若加兵於我，我則改圖耳。」"
  gloss_en: >-
    Shi Jingtang, suspicious and afraid, took counsel with his generals and staff: 'When I came back
    to Hedong, His Majesty promised me to my face that I would never be replaced as long as I lived.
    Now this sudden order — is it not just what he said to the princess at this year's Qianchun
    Festival? I am not the one stirring up trouble; the court is. How can I fold my hands and die on
    the road? For now I will send a memorial pleading illness and see what he intends. If he is
    lenient with me, I will serve him; if he sends troops against me, then I will change my plans.'
  persons: [shi_jingtang, princess_jinguo, li_congke]
  event_time:
    year: 936
    month: 5
    leap: false
    lunar: true
    note: "After 甲午 (≈ 29 May 936) and before the revolt was reported on 戊戌 (≈ 2 Jun 936)."
  location: jinyang_hq
  topics: [hedong_council, revolt, tianping_transfer, persona]
